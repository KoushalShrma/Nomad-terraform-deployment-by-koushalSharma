name: Deploy Nomad Cluster (example)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
        - destroy

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-west-2'

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      working-directory: ./terraform

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./terraform

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Generate SSH Key
      run: |
        ssh-keygen -t rsa -b 4096 -f /tmp/nomad-key -N "" -C "github-actions@nomad-cluster"
        echo "SSH_PUBLIC_KEY=$(cat /tmp/nomad-key.pub)" >> $GITHUB_ENV

    - name: Create terraform.tfvars
      run: |
        cat > terraform/terraform.tfvars << EOF
        aws_region = "${{ env.AWS_REGION }}"
        environment = "dev"
        cluster_name = "nomad-cluster-ci"
        server_instance_type = "t3.small"
        client_instance_type = "t3.small"
        client_count = 2
        ssh_public_key = "${{ env.SSH_PUBLIC_KEY }}"
        allowed_ssh_cidr = ["0.0.0.0/0"]
        allowed_ui_cidr = ["0.0.0.0/0"]
        EOF

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan -no-color
      working-directory: ./terraform

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Generate SSH Key
      run: |
        ssh-keygen -t rsa -b 4096 -f /tmp/nomad-key -N "" -C "github-actions@nomad-cluster"
        echo "SSH_PUBLIC_KEY=$(cat /tmp/nomad-key.pub)" >> $GITHUB_ENV

    - name: Create terraform.tfvars
      run: |
        cat > terraform/terraform.tfvars << EOF
        aws_region = "${{ env.AWS_REGION }}"
        environment = "production"
        cluster_name = "nomad-cluster-prod"
        server_instance_type = "t3.small"
        client_instance_type = "t3.small"
        client_count = 2
        ssh_public_key = "${{ env.SSH_PUBLIC_KEY }}"
        allowed_ssh_cidr = ["0.0.0.0/0"]
        allowed_ui_cidr = ["0.0.0.0/0"]
        EOF

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform

    - name: Save outputs
      run: |
        terraform output -json > /tmp/terraform-outputs.json
        echo "NOMAD_SERVER_IP=$(terraform output -raw nomad_server_public_ip)" >> $GITHUB_ENV
      working-directory: ./terraform

    - name: Wait for cluster readiness
      run: |
        echo "Waiting for Nomad cluster to be ready..."
        max_attempts=30
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt/$max_attempts: Checking Nomad server..."
          
          if curl -s "http://${{ env.NOMAD_SERVER_IP }}:4646/v1/status/leader" &> /dev/null; then
            echo "Nomad server is ready"
            break
          fi
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Nomad server failed to become ready"
            exit 1
          fi
          
          sleep 10
          ((attempt++))
        done

    - name: Install Nomad CLI
      run: |
        wget https://releases.hashicorp.com/nomad/1.6.2/nomad_1.6.2_linux_amd64.zip
        unzip nomad_1.6.2_linux_amd64.zip
        sudo mv nomad /usr/local/bin/
        chmod +x /usr/local/bin/nomad

    - name: Deploy sample application
      run: |
        export NOMAD_ADDR="http://${{ env.NOMAD_SERVER_IP }}:4646"
        nomad job run nomad-jobs/hello-world.nomad
        sleep 30
        nomad job status hello-world

    - name: Output connection info
      run: |
        echo "Deployment successful"
        echo "Nomad UI: http://${{ env.NOMAD_SERVER_IP }}:4646"
        cat /tmp/terraform-outputs.json

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Generate SSH Key
      run: |
        ssh-keygen -t rsa -b 4096 -f /tmp/nomad-key -N "" -C "github-actions@nomad-cluster"
        echo "SSH_PUBLIC_KEY=$(cat /tmp/nomad-key.pub)" >> $GITHUB_ENV

    - name: Create terraform.tfvars
      run: |
        cat > terraform/terraform.tfvars << EOF
        aws_region = "${{ env.AWS_REGION }}"
        environment = "production"
        cluster_name = "nomad-cluster-prod"
        server_instance_type = "t3.small"
        client_instance_type = "t3.small"
        client_count = 2
        ssh_public_key = "${{ env.SSH_PUBLIC_KEY }}"
        allowed_ssh_cidr = ["0.0.0.0/0"]
        allowed_ui_cidr = ["0.0.0.0/0"]
        EOF

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Destroy
      run: terraform destroy -auto-approve
      working-directory: ./terraform